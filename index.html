<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F3F4F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1018" media="(prefers-color-scheme: dark)">
<title>二开日历</title>
<style>
/* Layout: one narrow column (max 480px), one step on screen at a time, primary action pinned to the bottom like a native app.
   No web fonts on purpose: Google Fonts is unreliable in mainland China, so the system CJK stack is the type. */
:root{
  --bg:#F3F4F8; --surface:#FFFFFF; --ink:#15182B; --muted:#626780; --line:#DDE0EA;
  --accent:#2F49E8; --accent-ink:#FFFFFF; --accent-soft:#E6EAFD;
  --amber:#9A5B00; --amber-soft:#FFF1D9; --ok:#1E7F4F; --ok-soft:#DDF3E7;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --r:14px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0E1018; --surface:#171A26; --ink:#ECEEF6; --muted:#9AA0B8; --line:#2A2E40;
  --accent:#7D90FF; --accent-ink:#0E1018; --accent-soft:#1E2440;
  --amber:#F0B44C; --amber-soft:#3A2C10; --ok:#5FD39A; --ok-soft:#123323; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans);-webkit-text-size-adjust:100%;
  padding-top:env(safe-area-inset-top,0px)}
.app{max-width:480px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{padding-block:18px 6px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-weight:800;font-size:18px;letter-spacing:.02em}
.brand small{display:block;font-weight:400;font-size:12px;color:var(--muted);letter-spacing:0}
.mine-link{font:inherit;font-size:13px;color:var(--accent);background:var(--accent-soft);border:0;border-radius:999px;padding:6px 12px;cursor:pointer}
.steps{display:flex;gap:6px;margin:10px 0 18px}
.steps span{flex:1;height:4px;border-radius:2px;background:var(--line)}
.steps span.on{background:var(--accent)}
.steps-label{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:-12px;margin-bottom:16px}
.steps-label b{color:var(--ink);font-weight:600}
main{flex:1;display:flex;flex-direction:column;gap:16px;padding-bottom:20px}
h1{font-size:22px;line-height:1.3;margin:0;text-wrap:balance}
p.lead{margin:-8px 0 0;color:var(--muted)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{font:inherit;font-size:14px;border:0;border-radius:8px;padding:8px;background:transparent;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;color:var(--muted)}
input,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%}
textarea{min-height:84px;resize:vertical}
input:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.list{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;width:100%;font:inherit;color:inherit;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}
.opt .datebox{flex:none;width:48px;text-align:center;border-radius:8px;background:var(--bg);padding:4px 0;font-family:var(--mono);line-height:1.15}
.opt .datebox b{display:block;font-size:20px}
.opt .datebox i{font-style:normal;font-size:11px;color:var(--muted)}
.opt .t{min-width:0}
.opt .t b{display:block;font-weight:650}
.opt .t span{font-size:13px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer}
.chip.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);font-weight:600}
.hint{font-size:13px;color:var(--muted)}
.empty{font-size:14px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:14px;text-align:center}
.parsed{font-size:13px;border-radius:10px;padding:9px 12px;background:var(--ok-soft);color:var(--ok)}
.parsed.bad{background:var(--amber-soft);color:var(--amber)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* the ticket: the one object on the page that earns a card treatment */
.ticket{position:relative;background:var(--surface);border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
.ticket .top{padding:16px 16px 14px}
.ticket .plat{font-size:12px;color:var(--muted);letter-spacing:.06em}
.ticket h2{font-size:19px;margin:4px 0 2px;line-height:1.3}
.ticket .where{font-size:13px;color:var(--muted)}
.ticket .perf{position:relative;height:0;border-top:2px dashed var(--line);margin:0 14px}
.ticket .perf::before,.ticket .perf::after{content:"";position:absolute;top:-11px;width:20px;height:20px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.ticket .perf::before{left:-25px}.ticket .perf::after{right:-25px}
.ticket .stub{padding:12px 16px 16px;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.ticket .stub dt{color:var(--muted)}
.ticket .stub dd{margin:0;font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.ticket .stub dd.txt{font-family:var(--sans)}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--amber-soft);color:var(--amber)}
.cal{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.cal .e{display:grid;grid-template-columns:60px 1fr;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.cal .e:first-child{border-top:0}
.cal .when{font-family:var(--mono);font-size:12px;color:var(--muted);line-height:1.3;padding-top:2px}
.cal .e b{display:block;font-weight:600;font-size:14px}
.cal .e span{font-size:13px;color:var(--muted)}
.cal .e.key b{color:var(--accent)}
.bells{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.bells i{font-style:normal;font-size:11px;font-family:var(--mono);padding:2px 7px;border-radius:5px;background:var(--accent-soft);color:var(--accent)}
.sectitle{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.04em;margin:4px 0 -6px}
.big{display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;font:inherit;font-size:17px;font-weight:700;color:var(--accent-ink);background:var(--accent);border:0;border-radius:12px;padding:15px;width:100%;cursor:pointer}
.ghost{font:inherit;font-size:15px;color:var(--accent);background:transparent;border:1.5px solid var(--accent);border-radius:12px;padding:12px;width:100%;cursor:pointer}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.panel ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.panel code{font-family:var(--mono);font-size:12px;word-break:break-all;background:var(--bg);padding:2px 5px;border-radius:5px}
.warn{background:var(--amber-soft);color:var(--amber);border-radius:var(--r);padding:14px 16px;font-size:14px}
.warn b{display:block;font-size:16px;margin-bottom:4px}
.pointer{position:fixed;top:calc(6px + env(safe-area-inset-top,0px));right:max(14px,env(safe-area-inset-right,0px));font-size:28px;color:var(--amber);animation:nudge 1.2s ease-in-out infinite}
@keyframes nudge{50%{transform:translate(4px,-4px)}}
details{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
details summary{cursor:pointer;font-size:14px;color:var(--muted)}
details[open] summary{margin-bottom:10px}
details ol{margin:0;padding-left:20px;font-size:14px;display:flex;flex-direction:column;gap:6px}
.copyrow{display:flex;gap:8px;align-items:center}
.copyrow input{font-family:var(--mono);font-size:12px;padding:9px 10px}
.copyrow button{flex:none;font:inherit;font-size:14px;border:0;border-radius:8px;background:var(--accent-soft);color:var(--accent);padding:9px 12px;cursor:pointer}
.done{text-align:center;padding:12px 0 4px}
.done .mark{width:64px;height:64px;border-radius:50%;margin:0 auto 10px;display:grid;place-items:center;background:var(--ok-soft);color:var(--ok);font-size:32px;font-weight:700}
.mine{display:flex;flex-direction:column;gap:8px}
.mine .m{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.mine .m .t{flex:1;min-width:0}
.mine .m b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mine .m span{font-size:12px;color:var(--muted)}
.mine .m button{font:inherit;font-size:12px;color:var(--muted);background:none;border:0;padding:6px;cursor:pointer}
.status{font-size:12px;font-weight:600;color:var(--amber)}
.status.ok{color:var(--ok)}
.bar{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(to top,var(--bg) 70%,transparent);
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.bar .in{max-width:448px;margin:0 auto;display:flex;gap:10px}
.bar .back{flex:none;font:inherit;font-size:15px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:0 16px;cursor:pointer}
.bar .big[disabled]{opacity:.4;cursor:default}
footer{font-size:12px;color:var(--muted);padding:8px 0 calc(110px + env(safe-area-inset-bottom,0px));line-height:1.6}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:14px;padding:9px 14px;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){.pointer{animation:none}.toast{transition:none}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">二开日历<small>开票时间一确定，自动出现在你的日历里</small></div>
    <button class="mine-link" id="btn-mine" hidden>我的场次</button>
  </header>
  <div id="progress">
    <div class="steps"><span></span><span></span><span></span></div>
    <div class="steps-label"><span>录入场次</span><span>确认</span><span>加入日历</span></div>
  </div>
  <main id="view"></main>
  <footer>原型说明：演出数据为示例；场次只保存在这台手机的浏览器里；所有测试者订阅的是同一份日历，目前只同步重庆草莓音乐节。正式版每人一个专属日历地址。</footer>
</div>
<div class="bar" id="bar"><div class="in" id="bar-in"></div></div>
<div class="toast" id="toast"></div>

<script>
(function(){
  var CAL_HTTPS = 'https://monkeyshirley.github.io/ticket-cal/cal.ics';
  var CAL_WEBCAL = 'webcal://monkeyshirley.github.io/ticket-cal/cal.ics';
  var PAGE_URL = 'https://monkeyshirley.github.io/ticket-cal/';
  var WD = ['周日','周一','周二','周三','周四','周五','周六'];

  // Example show library (prototype). Real version: maintained in the backend.
  var LIB = [
    {id:'cq-strawberry-2026', name:'2026重庆草莓音乐节', city:'重庆', venue:'重庆国际博览中心 北室外展场', platform:'大麦 · 猫眼 · 正在现场',
      firstSale:'2026-11-03T13:00', status:'首开已售罄',
      sessions:[{id:'d1', date:'2026-11-28', label:'DAY1', note:'摇滚民谣场'},{id:'d2', date:'2026-11-29', label:'DAY2', note:'港乐与华语流行'}]},
    {id:'cq-jackson-2026', name:'王嘉尔 MAGICMAN 2 巡回演唱会 重庆站', city:'重庆', venue:'华熙生物 · 润百颜ECM中心', platform:'大麦',
      firstSale:null, status:'开票信息待确认',
      sessions:[{id:'s1', date:'2026-11-28', label:'', note:''}]}
  ];
  var KINDS = ['二开','回流票','加场'];

  var $ = function(s){return document.querySelector(s)};
  var view = $('#view'), barIn = $('#bar-in');
  var S = {step:1, mode:'search', q:'', pick:null, session:null, kinds:KINDS.slice(), paste:'', parsed:null, manual:{name:'',city:'',date:'',firstSale:''}, draft:null};

  function load(k, d){ try{ var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } }
  function save(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
  var mine = load('ec.mine', []);
  var subscribed = load('ec.subscribed', false);

  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]}); }
  function d(iso){ var p = iso.slice(0,10).split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
  function md(iso){ var x = d(iso); return (x.getMonth()+1)+'月'+x.getDate()+'日'; }
  function wd(iso){ return WD[d(iso).getDay()]; }
  function hm(iso){ return iso.length > 10 ? iso.slice(11,16) : ''; }
  function addDays(x, n){ var y = new Date(x); y.setDate(y.getDate()+n); return y; }
  function fmtD(x){ return (x.getMonth()+1)+'月'+x.getDate()+'日'; }
  function dot(x){ return (x.getMonth()+1)+'.'+x.getDate(); }
  function toast(m){ var t = $('#toast'); t.textContent = m; t.classList.add('show'); setTimeout(function(){t.classList.remove('show')}, 1800); }

  var ua = navigator.userAgent || '';
  var ENV = /MicroMessenger/i.test(ua) ? 'wechat'
          : /xhsdiscover|XiaoHongShu|discover\//i.test(ua) ? 'xhs'
          : /Weibo|QQ\/|DingTalk|AlipayClient|Claude/i.test(ua) ? 'inapp'
          : /iPhone|iPad|iPod/i.test(ua) ? 'ios'
          : /Android/i.test(ua) ? 'android' : 'desktop';
  var APPNAME = {wechat:'微信', xhs:'小红书', inapp:'当前 App'}[ENV];

  // ---------- link parsing ----------
  function parseLink(text){
    var m = String(text).match(/https?:\/\/[^\s"'<>，。]+/i);
    if(!m) return null;
    var url = m[0], host = '';
    try{ host = new URL(url).hostname; }catch(e){ return {ok:false, url:url}; }
    var plat = /damai|tb\.cn/i.test(host) ? '大麦' : /maoyan/i.test(host) ? '猫眼' : /showstart/i.test(host) ? '秀动' : /piaoxingqiu|pxq/i.test(host) ? '票星球' : /zhengzai|modernsky/i.test(host) ? '正在现场' : null;
    var id = (url.match(/[?&](?:itemId|id|showId)=(\d{5,})/i) || url.match(/\/(?:detail|item|shows?)\/(\d{5,})/i) || url.match(/(\d{8,})/) || [])[1] || null;
    return {ok:!!plat, url:url, platform:plat, id:id};
  }

  // ---------- estimate ----------
  function windowFor(firstSale, showDate){
    if(!firstSale) return null;
    var a = addDays(d(firstSale), 7), b = addDays(d(firstSale), 21), last = addDays(d(showDate), -2);
    if(b > last) b = last;
    var today = new Date(); today.setHours(0,0,0,0);
    if(a < today) a = today;
    if(b < a) return null;
    return {from:a, to:b};
  }

  // ---------- render ----------
  function setProgress(n){
    $('#progress').hidden = (n === 0);
    var bars = document.querySelectorAll('.steps span');
    for(var i=0;i<bars.length;i++) bars[i].classList.toggle('on', i < n);
    var labels = document.querySelectorAll('.steps-label span');
    for(var j=0;j<labels.length;j++) labels[j].innerHTML = (j === n-1) ? '<b>'+labels[j].textContent+'</b>' : labels[j].textContent;
  }
  function setBar(html){ barIn.innerHTML = html; $('#bar').hidden = !html; }
  function mineBtn(){ var b = $('#btn-mine'); b.hidden = !mine.length || S.step === 0; b.textContent = '我的场次 ' + mine.length; }

  function render(){
    mineBtn();
    if(S.step === 1) return step1();
    if(S.step === 2) return step2();
    if(S.step === 3) return step3();
    return doneView();
  }

  function step1(){
    setProgress(1);
    var h = '<h1>你想盯哪一场？</h1><p class="lead">选好场次后，二开、回流票、加场的开抢时间会自动进你的日历。</p>'
      + '<div class="seg" role="tablist"><button id="m-search" class="'+(S.mode==='search'?'on':'')+'">搜索演出</button><button id="m-paste" class="'+(S.mode==='paste'?'on':'')+'">粘贴购票链接</button></div>';
    if(S.mode === 'search'){
      var q = S.q.trim();
      var hits = LIB.filter(function(s){ return !q || (s.name+s.city+s.venue).toLowerCase().indexOf(q.toLowerCase()) > -1; });
      h += '<div class="field"><label for="q">演出名或城市</label><input id="q" type="search" placeholder="例：草莓 重庆" value="'+esc(S.q)+'" autocomplete="off"></div>';
      if(!hits.length){
        h += '<div class="empty">库里还没有这一场。<br>切到「粘贴购票链接」，把大麦或猫眼的分享链接贴进来。</div>';
      } else {
        h += '<div class="list">' + hits.map(function(s){
          var on = S.pick && S.pick.id === s.id;
          return '<button class="opt'+(on?' on':'')+'" data-pick="'+s.id+'"><div class="datebox"><b>'+d(s.sessions[0].date).getDate()+'</b><i>'+(d(s.sessions[0].date).getMonth()+1)+'月</i></div>'
            + '<div class="t"><b>'+esc(s.name)+'</b><span>'+esc(s.city)+' · '+esc(s.venue)+'</span></div></button>';
        }).join('') + '</div>';
      }
      if(S.pick && S.pick.sessions.length > 1){
        h += '<div class="sectitle">选择场次</div><div class="list">' + S.pick.sessions.map(function(se){
          var on = S.session && S.session.id === se.id;
          return '<button class="opt'+(on?' on':'')+'" data-sess="'+se.id+'"><div class="datebox"><b>'+d(se.date).getDate()+'</b><i>'+wd(se.date)+'</i></div>'
            + '<div class="t"><b>'+esc((se.label ? se.label+' · ' : '')+md(se.date))+'</b><span>'+esc(se.note||'')+'</span></div></button>';
        }).join('') + '</div>';
      }
    } else {
      h += '<div class="field"><label for="paste">在大麦 / 猫眼里点「分享」→「复制链接」，粘贴到这里</label><textarea id="paste" placeholder="https://m.damai.cn/shows/item.html?itemId=…">'+esc(S.paste)+'</textarea></div>';
      if(S.parsed){
        h += S.parsed.ok
          ? '<div class="parsed">已识别：'+esc(S.parsed.platform)+' 项目'+(S.parsed.id ? ' #'+esc(S.parsed.id) : '')+'。请补充下面的信息。</div>'
          : '<div class="parsed bad">没认出这是哪个平台的链接，可以直接手动填写下面的信息。</div>';
      }
      h += '<div class="field"><label for="mn">演出名称</label><input id="mn" value="'+esc(S.manual.name)+'" placeholder="例：五月天 2026 巡回演唱会 成都站"></div>'
        + '<div class="row2"><div class="field"><label for="mc">城市</label><input id="mc" value="'+esc(S.manual.city)+'" placeholder="成都"></div>'
        + '<div class="field"><label for="md">演出日期</label><input id="md" type="date" value="'+esc(S.manual.date)+'"></div></div>'
        + '<div class="field"><label for="mf">首开时间（知道就填，可不填）</label><input id="mf" type="datetime-local" value="'+esc(S.manual.firstSale)+'"></div>';
    }
    h += '<div class="sectitle">提醒我</div><div class="chips">' + KINDS.map(function(k){ return '<button class="chip'+(S.kinds.indexOf(k)>-1?' on':'')+'" data-kind="'+k+'">'+k+'</button>'; }).join('') + '</div>';
    view.innerHTML = h;
    setBar('<button class="big" id="next1"'+(ready1()?'':' disabled')+'>下一步</button>');
  }
  function ready1(){
    if(!S.kinds.length) return false;
    if(S.mode === 'search') return !!(S.pick && S.session);
    return !!(S.manual.name.trim() && S.manual.date);
  }
  function buildDraft(){
    if(S.mode === 'search'){
      var s = S.pick, se = S.session;
      return {key:s.id+'-'+se.id, name:s.name, sessionLabel:(se.label ? se.label+' · ' : '')+md(se.date)+' '+wd(se.date), date:se.date,
        city:s.city, venue:s.venue, platform:s.platform, firstSale:s.firstSale, status:s.status, kinds:S.kinds.slice(), source:'库'};
    }
    var m = S.manual;
    return {key:'manual-'+(S.parsed && S.parsed.id ? S.parsed.id : Date.now().toString(36))+'-'+m.date, name:m.name.trim(), sessionLabel:md(m.date)+' '+wd(m.date), date:m.date,
      city:m.city.trim(), venue:'', platform:(S.parsed && S.parsed.platform) || '未知平台', firstSale:m.firstSale || null,
      status:'待核实', kinds:S.kinds.slice(), source:'手动', link:S.parsed ? S.parsed.url : ''};
  }

  function step2(){
    setProgress(2);
    var x = S.draft, w = windowFor(x.firstSale, x.date);
    var h = '<h1>确认这一场</h1>'
      + '<div class="ticket"><div class="top"><div class="plat">'+esc(x.platform)+'</div><h2>'+esc(x.name)+'</h2><div class="where">'+esc(x.sessionLabel)+(x.city ? ' · '+esc(x.city) : '')+(x.venue ? ' · '+esc(x.venue) : '')+'</div></div>'
      + '<div class="perf"></div><dl class="stub">'
      + '<dt>当前状态</dt><dd class="txt"><span class="badge">'+esc(x.status)+'</span></dd>'
      + '<dt>首开</dt><dd>'+(x.firstSale ? md(x.firstSale)+' '+hm(x.firstSale) : '<span class="txt">未知</span>')+'</dd>'
      + '<dt>预计二开</dt><dd>'+(w ? fmtD(w.from)+' – '+fmtD(w.to) : '<span class="txt">待公告</span>')+'</dd>'
      + '<dt>提醒类型</dt><dd class="txt">'+esc(x.kinds.join(' · '))+'</dd>'
      + '</dl></div>'
      + '<div class="sectitle">会出现在你日历里的</div><div class="cal">'
      + (w ? '<div class="e"><div class="when">'+dot(w.from)+'<br>起</div><div><b>预计二开窗口</b><span>全天显示，不响铃。估算值，公告后替换。</span></div></div>' : '')
      + '<div class="e key"><div class="when">确定后<br>自动出现</div><div><b>'+esc(x.kinds[0])+'开抢时间</b><span>后台发现确切时间后写入</span><div class="bells"><i>提前 1 天</i><i>提前 1 小时</i><i>提前 10 分钟</i></div></div></div>'
      + '<div class="e"><div class="when">'+dot(d(x.date))+'<br>'+wd(x.date)+'</div><div><b>演出日</b><span>'+esc(x.sessionLabel)+'</span></div></div>'
      + '</div>'
      + (x.source === '手动' ? '<p class="hint">这一场不在库里，提交后我们会先核实场次信息，再开始监控。</p>' : '');
    view.innerHTML = h;
    setBar('<button class="back" id="back">返回</button><button class="big" id="next2">'+(subscribed ? '加入我的日历' : '下一步：加入日历')+'</button>');
  }

  // In-app browsers (WeChat, 小红书) don't share storage with Safari, so the chosen show rides along in the URL.
  function draftUrl(){ return PAGE_URL + '#d=' + encodeURIComponent(JSON.stringify(S.draft)); }
  function step3(){
    setProgress(3);
    try{ history.replaceState(null, '', '#d=' + encodeURIComponent(JSON.stringify(S.draft))); }catch(e){}
    var h = '<h1>授权加入日历</h1><p class="lead">只需要做一次。以后再添加场次，会自动出现在同一个日历里。</p>';
    if(ENV === 'wechat' || ENV === 'xhs' || ENV === 'inapp'){
      h += '<div class="pointer" aria-hidden="true">↗</div>'
        + '<div class="warn"><b>请先在 Safari 中打开</b>'+esc(APPNAME)+'里无法添加日历。点右上角「···」，选「在 Safari 中打开」（安卓选「在浏览器打开」），回到这一步继续。</div>'
        + '<p class="hint">「在 Safari 中打开」后会直接回到这一步，选好的场次会带过去。也可以复制下面的地址，粘贴到 Safari。</p>'
        + '<div class="copyrow"><input readonly value="'+esc(draftUrl())+'" id="pageurl" aria-label="本页地址"><button data-copy="pageurl">复制</button></div>';
      setBar('<button class="back" id="back">返回</button>');
    } else if(ENV === 'ios'){
      h += '<a class="big" id="sub" href="'+CAL_WEBCAL+'">订阅到 iPhone 日历</a>'
        + '<div class="panel"><ol><li>点上面的按钮，系统会弹出「订阅此日历？」</li><li>点「订阅」，再点右上角「完成」</li><li>回到这里，点下方「我已订阅」</li></ol></div>'
        + manualIOS();
      setBar('<button class="back" id="back">返回</button><button class="big" id="confirm-sub">我已订阅</button>');
    } else if(ENV === 'android'){
      h += '<div class="warn"><b>安卓暂不支持一键订阅</b>复制下面的地址，在系统「日历」app 里找「添加日历订阅」「订阅日历」或「导入 URL」。不同品牌位置不同，找不到可以告诉我们你的手机型号。</div>'
        + '<div class="copyrow"><input readonly value="'+CAL_HTTPS+'" id="calurl" aria-label="日历地址"><button data-copy="calurl">复制</button></div>';
      setBar('<button class="back" id="back">返回</button><button class="big" id="confirm-sub">我已添加</button>');
    } else {
      h += '<div class="warn"><b>请用手机打开这一页</b>日历提醒要加到你随身带的手机上。用手机浏览器访问下面的地址，选好场次后在这一步订阅。</div>'
        + '<div class="copyrow"><input readonly value="'+PAGE_URL+'" id="pageurl" aria-label="本页地址"><button data-copy="pageurl">复制</button></div>'
        + '<details><summary>一定要在电脑上订阅？</summary><div class="copyrow"><input readonly value="'+CAL_HTTPS+'" id="calurl" aria-label="日历地址"><button data-copy="calurl">复制</button></div><p class="hint">Mac：日历 → 文件 → 新建日历订阅，粘贴地址。</p></details>';
      setBar('<button class="back" id="back">返回</button><button class="big" id="confirm-sub">我已订阅</button>');
    }
    view.innerHTML = h;
  }
  function manualIOS(){
    return '<details><summary>按钮没反应？手动添加</summary><ol>'
      + '<li>打开「设置」→「App」→「日历」（旧版 iOS 直接进「日历」）</li>'
      + '<li>「日历账户」→「添加账户」→「其他」→「添加已订阅的日历」</li>'
      + '<li>服务器一栏粘贴下面的地址，「下一步」→「存储」</li></ol>'
      + '<div class="copyrow" style="margin-top:10px"><input readonly value="'+CAL_HTTPS+'" id="calurl" aria-label="日历地址"><button data-copy="calurl">复制</button></div></details>';
  }

  function doneView(){
    setProgress(0);
    var h = '<div class="done"><div class="mark">✓</div><h1>已加入你的日历</h1><p class="lead" style="margin-top:6px">开抢时间一确定，日历会自动出现事件，并提前 1 天、1 小时、10 分钟提醒你。</p></div>'
      + '<div class="sectitle">我的场次</div>' + mineList()
      + '<details><summary>日历里没看到？</summary><ol><li>打开「日历」app，点底部「日历」，确认「演出开票提醒」已勾选</li><li>订阅日历一般每小时刷新一次，刚添加的场次可能要等一会儿</li></ol></details>';
    view.innerHTML = h;
    setBar('<button class="big" id="again">再添加一场</button>');
  }
  function mineList(){
    if(!mine.length) return '<div class="empty">还没有场次</div>';
    return '<div class="mine">' + mine.map(function(x, i){
      return '<div class="m"><div class="t"><b>'+esc(x.name)+'</b><span>'+esc(x.sessionLabel)+' · '+esc(x.kinds.join('/'))+'</span><div class="status'+(x.source==='库'?' ok':'')+'">'+(x.source==='库' ? '监控中' : '待核实')+'</div></div><button data-del="'+i+'" aria-label="移除">移除</button></div>';
    }).join('') + '</div>';
  }

  function commit(){
    var x = S.draft;
    if(!mine.some(function(m){ return m.key === x.key; })){ x.addedAt = new Date().toISOString(); mine.push(x); save('ec.mine', mine); }
    S.step = 4; reset(); save('ec.draft', null);
    try{ history.replaceState(null, '', location.pathname); }catch(e){}
    render(); scrollTo(0,0);
  }
  function reset(){ S.mode='search'; S.q=''; S.pick=null; S.session=null; S.kinds=KINDS.slice(); S.paste=''; S.parsed=null; S.manual={name:'',city:'',date:'',firstSale:''}; }
  function go(n){ S.step = n; render(); scrollTo(0,0); save('ec.draft', {step:S.step, draft:S.draft}); }

  // ---------- events ----------
  document.addEventListener('click', function(e){
    var t = e.target.closest('button, a'); if(!t) return;
    if(t.id === 'm-search' || t.id === 'm-paste'){ S.mode = t.id === 'm-search' ? 'search' : 'paste'; render(); return; }
    if(t.dataset.pick){ var s = LIB.filter(function(x){return x.id===t.dataset.pick})[0]; S.pick = s; S.session = s.sessions.length === 1 ? s.sessions[0] : null; render(); return; }
    if(t.dataset.sess){ S.session = S.pick.sessions.filter(function(x){return x.id===t.dataset.sess})[0]; render(); return; }
    if(t.dataset.kind){ var k = t.dataset.kind, i = S.kinds.indexOf(k); if(i>-1) S.kinds.splice(i,1); else S.kinds.push(k); render(); return; }
    if(t.dataset.copy){ copy(t.dataset.copy); return; }
    if(t.dataset.del){ mine.splice(+t.dataset.del, 1); save('ec.mine', mine); render(); return; }
    if(t.id === 'next1' && ready1()){ S.draft = buildDraft(); go(2); return; }
    if(t.id === 'next2'){ if(subscribed){ commit(); } else { go(3); } return; }
    if(t.id === 'back'){ go(S.step - 1); return; }
    if(t.id === 'sub'){ save('ec.tapped', true); return; }
    if(t.id === 'confirm-sub'){ subscribed = true; save('ec.subscribed', true); commit(); return; }
    if(t.id === 'again'){ S.step = 1; S.draft = null; render(); scrollTo(0,0); return; }
    if(t.id === 'btn-mine'){ S.step = 4; render(); scrollTo(0,0); return; }
  });
  document.addEventListener('input', function(e){
    var t = e.target;
    if(t.id === 'q'){ S.q = t.value; var pos = t.selectionStart; render(); var q = $('#q'); q.focus(); try{ q.setSelectionRange(pos,pos); }catch(_){} return; }
    if(t.id === 'paste'){ S.paste = t.value; var p = parseLink(t.value); var changed = JSON.stringify(p) !== JSON.stringify(S.parsed); S.parsed = p;
      if(changed){ var v = t.value; render(); var ta = $('#paste'); ta.focus(); ta.setSelectionRange(v.length, v.length); } else { syncBar(); } return; }
    if(t.id === 'mn'){ S.manual.name = t.value; syncBar(); }
    if(t.id === 'mc'){ S.manual.city = t.value; syncBar(); }
    if(t.id === 'md'){ S.manual.date = t.value; syncBar(); }
    if(t.id === 'mf'){ S.manual.firstSale = t.value; syncBar(); }
  });
  function syncBar(){ var b = $('#next1'); if(b) b.disabled = !ready1(); }
  function copy(id){
    var el = document.getElementById(id); if(!el) return;
    var done = function(){ toast('已复制'); };
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(el.value).then(done, function(){ el.select(); toast('已选中，长按拷贝'); }); }
    else { el.select(); try{ document.execCommand('copy'); done(); }catch(e){ toast('已选中，长按拷贝'); } }
  }

  // resume: an in-app visitor who switched to Safari lands back on step 3 with the same draft
  var fromUrl = null;
  try{ var m = location.hash.match(/^#d=(.+)$/); if(m) fromUrl = JSON.parse(decodeURIComponent(m[1])); }catch(e){}
  var saved = load('ec.draft', null);
  if(fromUrl && fromUrl.name && fromUrl.date){ S.draft = fromUrl; S.step = subscribed ? 2 : 3; }
  else if(saved && saved.draft && saved.step >= 2 && saved.step <= 3){ S.draft = saved.draft; S.step = saved.step; }
  else if(mine.length && subscribed){ S.step = 4; }
  render();
})();
</script>
</body>
</html>
